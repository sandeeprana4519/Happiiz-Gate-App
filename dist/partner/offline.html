<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Offline — Happiiz Partner App</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #1C1917;
      color: #F8FAFC;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
      text-align: center;
    }
    .card {
      background: rgba(69, 26, 3, 0.85);
      border: 1px solid rgba(251, 191, 36, 0.35);
      border-radius: 24px;
      padding: 2rem 1.5rem;
      max-width: 400px;
      width: 100%;
    }
    h1 { font-size: 1.35rem; margin-bottom: 0.75rem; }
    p { font-size: 0.9rem; color: #FDE68A; line-height: 1.5; margin-bottom: 1.5rem; }
    button {
      width: 100%;
      padding: 0.875rem 1rem;
      border-radius: 12px;
      border: none;
      background: #F59E0B;
      color: #1C1917;
      font-weight: 700;
      font-size: 0.9rem;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>Happiiz Partner Offline</h1>
    <p>No active internet connection detected. Reconnect to receive resident service work orders and technician gate entry passes.</p>
    <button onclick="window.location.reload()">Retry Connection</button>
  </div>
</body>
</html>
